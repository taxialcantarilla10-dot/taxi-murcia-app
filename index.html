async function openCustomerWhatsApp(serviceId){const {data:service}=await db.from('services').select('*').eq('id',serviceId).maybeSingle();if(!service)return toast('No se ha encontrado el servicio');const [{data:profile},{data:driver},{data:location}]=await Promise.all([db.from('profiles').select('phone').eq('id',service.customer_id).maybeSingle(),db.from('drivers').select('license_number,vehicle_plate').eq('id',currentDriverUser.id).maybeSingle(),db.from('driver_locations').select('latitude,longitude').eq('driver_id',currentDriverUser.id).maybeSingle()]);const raw=String(profile&&profile.phone||'').replace(/\D/g,'');if(!raw)return toast('El cliente no tiene un número de WhatsApp registrado');let estimate=null;try{estimate=await buildEstimate({lat:Number(service.origin_latitude),lon:Number(service.origin_longitude)},{lat:Number(service.destination_latitude),lon:Number(service.destination_longitude)})}catch(e){}let eta='—';if(location&&Number.isFinite(Number(location.latitude))){const r=await routeMetric({lat:Number(location.latitude),lon:Number(location.longitude)},{lat:Number(service.origin_latitude),lon:Number(service.origin_longitude)});eta=Math.max(1,Math.ceil(r.duration_s/60))+' min'}const fare=estimate?estimate.total.toFixed(2).replace('.',',')+' €':service.estimated_fare?Number(service.estimated_fare).toFixed(2).replace('.',',')+' €':'pendiente';const text='Su taxi está en camino. Licencia: '+(driver&&driver.license_number||'—')+'. Matrícula: '+(driver&&driver.vehicle_plate||'—')+'. Tiempo estimado de llegada: '+eta+'. Precio estimado: '+fare+'.';window.open('https://wa.me/'+raw+'?text='+encodeURIComponent(text),'_blank','noopener')}function serviceKm(a,b){return distanceM({lat:Number(a.latitude||a.lat),lon:Number(a.longitude||a.lon)},{lat:Number(b.origin_latitude),lon:Number(b.origin_longitude)})}
