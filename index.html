<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxi Murcia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3Ap8p3L9lG7D5h2JtqX4A6A0YxY=" crossorigin="">
<style>
:root{--green:#12a77a;--dark:#10231f;--mint:#e9faf4;--line:#dfe9e5;--muted:#6b7d76;--red:#dc4050;--amber:#eaa51a}*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:var(--dark);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.shell{max-width:760px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 45px #0d2d2414}.top{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;font-size:14px}.online{color:var(--green);font-size:11px;font-weight:800}.page{padding:20px}.role-screen{padding:28px 20px 36px;background:linear-gradient(155deg,#f2fcf8,#fff)}h1{font-size:29px;letter-spacing:-.7px;margin:0 0 7px}.sub{color:var(--muted);font-size:14px;margin-bottom:24px}.role-list{display:grid;gap:12px}.role{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 7px 20px #163a2b0b}.role:hover{border-color:var(--green);transform:translateY(-1px)}.role-icon{font-size:27px}.role strong{display:block}.role small{color:var(--muted)}.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 9px 26px #163a2b0b}.box h2{margin:0 0 5px;font-size:21px}.back{color:var(--green);background:none;padding:0;font-weight:800;font-size:13px;margin-bottom:14px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin:0 0 5px}.field input{width:100%;border:1px solid var(--line);padding:12px;border-radius:11px;outline:0}.field input:focus{border-color:var(--green)}.primary{width:100%;background:var(--green);color:#fff;padding:13px;border-radius:11px;font-weight:900;margin-top:9px}.secondary{width:100%;background:var(--mint);color:#096c4d;padding:11px;border-radius:11px;font-weight:800;margin-top:8px}.muted-btn{width:100%;background:#fff;color:var(--muted);padding:10px;border-radius:10px;margin-top:6px}.error{color:var(--red);font-size:12px;margin-top:10px}.ok{color:#08774f;background:var(--mint);border-radius:10px;padding:9px;font-size:12px;margin-top:10px}.hidden{display:none!important}.map{height:420px;border-radius:16px;overflow:hidden;background:#d9ece8}.dash-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:14px}.dash-head h2{margin:0;font-size:21px}.logout{color:var(--red);background:#fff0f1;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800}.status{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:12px;border-radius:12px;background:var(--mint);font-size:13px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}.panel-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:11px}.metric strong{display:block;font-size:20px}.metric small{color:var(--muted)}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:11px 15px;border-radius:12px;background:var(--dark);color:#fff;font-size:12px;z-index:1000}.car{font-size:22px;text-shadow:0 2px 4px #0003}.driver-free{filter:hue-rotate(90deg)}.driver-busy{filter:hue-rotate(310deg)}@media(min-width:761px){body{padding:20px 0}.shell{border-radius:22px;overflow:hidden}.role-screen{padding:54px 70px 60px}}
</style>
</head>
<body><div class="shell"><div class="top"><div class="brand"><span class="mark">TM</span>Taxi Murcia</div><div class="online" id="connection">● Preparado</div></div>
<section id="roles" class="role-screen"><h1>¿Cómo vas a usar Taxi Murcia?</h1><p class="sub">Elige tu perfil. Una vez dentro solo verás tu propia pantalla.</p><div class="role-list"><button class="role" data-role="client"><span class="role-icon">👤</span><span><strong>Cliente</strong><small>Pedir un taxi y ver tu trayecto.</small></span></button><button class="role" data-role="driver"><span class="role-icon">🚕</span><span><strong>Taxista</strong><small>Registrarse o entrar si ya tienes una cuenta.</small></span></button><button class="role" data-role="admin"><span class="role-icon">⚙️</span><span><strong>Administrador</strong><small>Gestionar paradas y consultar el resumen.</small></span></button></div></section>
<section id="auth" class="page hidden"><div class="box"><button class="back" id="back">← Volver</button><h2 id="auth-title">Acceso</h2><p class="sub" id="auth-sub">Entra o crea tu cuenta.</p><div id="driver-fields" class="hidden"><div class="field"><label>Nombre</label><input id="full-name" placeholder="Nombre y apellidos"></div><div class="field"><label>Número de licencia</label><input id="license" placeholder="Licencia"></div><div class="field"><label>Matrícula</label><input id="plate" placeholder="1234 ABC"></div></div><div class="field"><label>Correo electrónico</label><input id="email" type="email" placeholder="correo@ejemplo.com"></div><div class="field"><label>Contraseña</label><input id="password" type="password" placeholder="Contraseña"></div><button class="primary" id="login">Entrar</button><button class="secondary" id="register">Crear registro</button><div class="error" id="auth-error"></div><div class="ok hidden" id="auth-ok"></div></div></section>
<section id="dashboard" class="page hidden"><div class="dash-head"><div><h2 id="dash-title">Mapa</h2><div class="sub" id="dash-sub">Conectado en tiempo real</div></div><button class="logout" id="logout">Salir</button></div><div id="dash-content"></div></section></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/QEw7nYj4vVY1hZ0c9Zx8=" crossorigin=""></script>
<script>
const SUPABASE_URL='https://cnajheurgieenmpvngpl.supabase.co';const SUPABASE_KEY='sb_publishable_qw82O8w1AEzY7mz24NqFpg_6TBKr_uS';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let selectedRole=null, map=null, userMarker=null, watchId=null, channel=null, driverMarkers={};
const $=id=>document.getElementById(id), show=id=>$(id).classList.remove('hidden'), hide=id=>$(id).classList.add('hidden');
function toast(t){$('toast').textContent=t;show('toast');setTimeout(()=>hide('toast'),3000)}
function setConnection(t,good=true){$('connection').textContent=(good?'● ':'! ')+t;$('connection').style.color=good?'var(--green)':'var(--amber)'}
function reset(){hide('auth');hide('dashboard');show('roles');$('auth-error').textContent='';$('auth-ok').textContent='';hide('auth-ok');}
function authScreen(role){selectedRole=role;hide('roles');show('auth');$('auth-title').textContent=role==='client'?'Acceso de cliente':role==='driver'?'Acceso de taxista':'Acceso de administrador';$('auth-sub').textContent=role==='driver'?'Regístrate con tus datos del vehículo.':'Entra o crea tu cuenta.';role==='driver'?show('driver-fields'):hide('driver-fields');$('password').value=role==='admin'?'232323':''}
async function ensureProfile(user,role){const data={id:user.id,role,full_name:$('full-name').value||user.user_metadata?.full_name||null,email:user.email||null,phone:user.user_metadata?.phone||null};const {error}=await db.from('profiles').upsert(data);if(error)throw error;if(role==='driver'){const {error:e}=await db.from('drivers').upsert({id:user.id,license_number:$('license').value||'PENDIENTE-'+user.id.slice(0,6),vehicle_plate:$('plate').value||'PENDIENTE',approval_status:'pending',availability:'offline'});if(e)throw e}}
async function auth(mode){$('auth-error').textContent='';try{let email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('Completa correo y contraseña.');let result=mode==='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{data:{role:selectedRole,full_name:$('full-name').value}}});if(result.error)throw result.error;if(!result.data.user)throw Error('Revisa tu correo para confirmar la cuenta.');if(result.data.session)await ensureProfile(result.data.user,selectedRole);else{$('auth-ok').textContent='Registro creado. Si te pide confirmación, revisa el correo.';show('auth-ok');return}await openDashboard(result.data.user)}catch(e){$('auth-error').textContent=e.message||'No se pudo completar el acceso.'}}
async function openDashboard(user){hide('auth');show('dashboard');if(selectedRole==='client')clientDash(user);else if(selectedRole==='driver')driverDash(user);else adminDash(user)}
function makeMap(){if(map)return map;map=L.map('map',{zoomControl:true}).setView([37.969, -1.217],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);return map}
function taxiIcon(state='available'){return L.divIcon({className:'car '+(state==='busy'?'driver-busy':'driver-free'),html:'🚕',iconSize:[28,28],iconAnchor:[14,14]})}
async function loadDrivers(){if(!map)return;const {data}=await db.from('driver_locations').select('*');(data||[]).forEach(d=>upsertDriverMarker(d));channel=db.channel('taxi-live').on('postgres_changes',{event:'*',schema:'public',table:'driver_locations'},p=>{if(p.eventType==='DELETE'){if(driverMarkers[p.old.driver_id]){map.removeLayer(driverMarkers[p.old.driver_id]);delete driverMarkers[p.old.driver_id]}}else upsertDriverMarker(p.new)}).subscribe();setConnection('Mapa en tiempo real')}
function upsertDriverMarker(d){if(!map||!d.latitude||!d.longitude)return;const pos=[d.latitude,d.longitude];if(!driverMarkers[d.driver_id])driverMarkers[d.driver_id]=L.marker(pos,{icon:taxiIcon(d.availability)}).addTo(map);else driverMarkers[d.driver_id].setLatLng(pos);driverMarkers[d.driver_id].setPopupContent('Taxi · '+(d.availability==='busy'?'Ocupado':'Libre'))}
function clientDash(user){$('dash-title').textContent='Pide tu taxi';$('dash-sub').textContent='Tu ubicación y los taxis se actualizan en directo';$('dash-content').innerHTML='<div id="map" class="map"></div><div class="box" style="margin-top:12px"><div class="field"><label>Recogida</label><input id="origin" placeholder="Usar mi ubicación actual"></div><div class="field"><label>Destino</label><input id="destination" placeholder="Indica tu destino"></div><button class="primary" id="request">Solicitar taxi</button><div class="panel-row"><div class="metric"><strong id="free-count">—</strong><small>Taxis visibles</small></div><div class="metric"><strong>GPS</strong><small>Alta precisión activa</small></div></div></div>';const m=makeMap();navigator.geolocation?.watchPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];if(!userMarker)userMarker=L.marker(p).addTo(m).bindPopup('Tu ubicación');else userMarker.setLatLng(p);m.setView(p,16);$('origin').value='Mi ubicación actual';},()=>toast('Activa la ubicación precisa del dispositivo'),{enableHighAccuracy:true,maximumAge:5000,timeout:15000});loadDrivers();$('request').onclick=()=>toast('Solicitud preparada: en la siguiente fase se asignará el taxi por cola')}
async function driverDash(user){$('dash-title').textContent='Panel del taxista';$('dash-sub').textContent='Mapa de taxis en tiempo real';$('dash-content').innerHTML='<div id="map" class="map"></div><div class="status"><span><span class="dot"></span><span id="driver-status">Conectando GPS…</span></span><span id="queue-pos">Posición —</span></div><div class="panel-row"><div class="metric"><strong id="free-count">—</strong><small>Taxis visibles</small></div><div class="metric"><strong>En línea</strong><small>Compartiendo posición</small></div></div>';const m=makeMap();await loadDrivers();if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(async pos=>{const d={driver_id:user.id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy_m:pos.coords.accuracy,heading:pos.coords.heading,speed_mps:pos.coords.speed,availability:'available',updated_at:new Date().toISOString()};await db.from('driver_locations').upsert(d);await db.from('drivers').update({latitude:d.latitude,longitude:d.longitude,gps_accuracy_m:d.accuracy_m,location_updated_at:d.updated_at,availability:'available'}).eq('id',user.id);$('driver-status').textContent='GPS compartido · ±'+Math.round(pos.coords.accuracy)+' m';if(!userMarker)userMarker=L.marker([d.latitude,d.longitude],{icon:taxiIcon('available')}).addTo(m);else userMarker.setLatLng([d.latitude,d.longitude]);m.setView([d.latitude,d.longitude],15)},()=>{$('driver-status').textContent='Sin permiso de ubicación'}, {enableHighAccuracy:true,maximumAge:3000,timeout:15000});else $('driver-status').textContent='Este dispositivo no ofrece GPS'}
async function adminDash(user){$('dash-title').textContent='Panel administrador';$('dash-sub').textContent='Paradas, taxis y servicios';$('dash-content').innerHTML='<div id="map" class="map"></div><div class="panel-row"><div class="metric"><strong id="free-count">—</strong><small>Taxis en mapa</small></div><div class="metric"><strong>0</strong><small>Servicios hoy</small></div></div><div class="box" style="margin-top:12px"><strong>Panel conectado</strong><p class="sub" style="margin:6px 0 0">Desde aquí se gestionarán paradas, tarifas y taxistas.</p></div>';makeMap();loadDrivers()}
$('back').onclick=reset;$('login').onclick=()=>auth('login');$('register').onclick=()=>auth('register');$('logout').onclick=async()=>{if(watchId)navigator.geolocation.clearWatch(watchId);if(channel)db.removeChannel(channel);if(map){map.remove();map=null;userMarker=null;driverMarkers={}}await db.auth.signOut();reset()};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>authScreen(b.dataset.role));db.auth.getSession().then(({data})=>{if(data.session)setConnection('Sesión disponible')});
</script></body></html>
