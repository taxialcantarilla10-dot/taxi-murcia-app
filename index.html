const SUPABASE_URL='https://cnajheurgieenmpvngpl.supabase.co';const SUPABASE_KEY='sb_publishable_qw82O8w1AEzY7mz24NqFpg_6TBKr_uS';const db=window.supabase && window.supabase.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;if(!db)setConnection('Servidor no disponible',false);let selectedRole=null,selectedAuthMode='login',currentUserId=null,currentHeading=null, map=null, userMarker=null, watchId=null, channel=null, queueChannel=null, queueTimer=null, driverMarkers={},stopLayers={},adminDraftMarker=null;

async function ensureProfile(user,role){const data={id:user.id,role,full_name:$('full-name').value||(user.user_metadata&&user.user_metadata.full_name)||null,email:user.email||null,phone:user.phone||(user.user_metadata&&user.user_metadata.phone)||$('phone').value.trim()||null};const {error}=await db.from('profiles').upsert(data);if(error)throw error;if(role==='driver'){const {error:e}=await db.from('drivers').upsert({id:user.id,license_number:$('license').value||'PENDIENTE-'+user.id.slice(0,6),vehicle_plate:$('plate').value||'PENDIENTE',approval_status:'pending',availability:'offline'});if(e)throw e}}
async function auth(mode){$('auth-error').textContent='';try{if(!db)throw Error('No hay conexión con el servidor. Comprueba Internet y vuelve a abrir la aplicación.');const password=$('password').value;const isDriver=selectedRole==='driver';const email=$('email').value.trim();const phone=$('phone').value.trim();if(!password)throw Error('Escribe la contraseña.');if(selectedRole==='admin'&&!email)throw Error('El administrador debe introducir su correo y su clave.');if(isDriver&&mode==='register'&&(!email||!phone))throw Error('Para registrar el taxi necesitamos correo y teléfono.');if(isDriver&&mode==='login'&&!email&&!phone)throw Error('Escribe el correo o el teléfono con el que te registraste.');if(!isDriver&&selectedRole!=='admin'&&!email)throw Error('Escribe tu correo electrónico.');let result;if(isDriver&&mode==='login'&&!email&&phone)result=await db.auth.signInWithPassword({phone,password});else if(mode==='login')result=await db.auth.signInWithPassword({email,password});else result=await db.auth.signUp({email,password,options:{data:{role:selectedRole,full_name:$('full-name').value,phone}}});if(result.error)throw result.error;if(!result.data.user)throw Error('No se pudo crear la cuenta.');if(result.data.session)await ensureProfile(result.data.user,selectedRole);else{$('auth-ok').textContent='Registro creado. Te hemos enviado un correo electrónico. Ábrelo y pulsa el enlace de verificación antes de entrar.';show('auth-ok');return}await openDashboard(result.data.user)}catch(e){$('auth-error').textContent=e.message||'No se pudo completar el acceso.'}}
async function openDashboard(user){currentUserId=user.id;hide('auth');show('dashboard');if(selectedRole==='client')clientDash(user);else if(selectedRole==='driver')driverDash(user);else adminDash(user)}
function makeMap(){if(map)return map;map=L.map('map',{zoomControl:true}).setView([37.969, -1.217],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);return map}
function taxiIcon(state='available'){const cls=state==='self'?'taxi-self':state==='busy'?'taxi-busy':'taxi-free';return L.divIcon({className:'taxi-marker-wrap',html:`<div class="taxi-marker ${cls}" title="${state==='self'?'Tu taxi':state==='busy'?'Taxi ocupado':'Taxi libre'}"><svg viewBox="0 0 96 52" aria-hidden="true"><path fill="#fff" d="M17 20l7-11h42l9 11 12 4v17H9V24l8-4zm15-6l-4 6h34l-4-6H32zM23 35a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm48 0a6 6 0 1 0 0 12 6 6 0 0 0-12zM34 25h28v5H34z"/></svg></div>`,iconSize:[48,29],iconAnchor:[24,14]})}function userIcon(){return L.divIcon({className:'user-marker-wrap',html:'<div class="user-marker" title="Tu ubicación"><svg viewBox="0 0 40 52" aria-hidden="true"><circle cx="18" cy="10" r="7" fill="#f2c94c" stroke="#fff" stroke-width="2"/><path d="M18 18v18m0-13l-9 8m9-8l10-11m-10 11l13 6M18 36l-7 13m7-13l9 13" fill="none" stroke="#f2c94c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 14l6-8" fill="none" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/></svg></div>',iconSize:[34,44],iconAnchor:[17,42]})}function setTaxiHeading(marker,heading){const value=Number(heading);if(!marker||!Number.isFinite(value))return;marker._heading=value;const el=marker.getElement?marker.getElement().querySelector('.taxi-marker'):null;if(el)el.style.transform='rotate('+value+'deg)'}
async function loadDrivers(){if(!map)return;const {data}=await db.from('driver_locations').select('*');(data||[]).forEach(d=>upsertDriverMarker(d));channel=db.channel('taxi-live').on('postgres_changes',{event:'*',schema:'public',table:'driver_locations'},p=>{if(p.eventType==='DELETE'){if(driverMarkers[p.old.driver_id]){map.removeLayer(driverMarkers[p.old.driver_id]);delete driverMarkers[p.old.driver_id]}}else upsertDriverMarker(p.new)}).subscribe();setConnection('Mapa OpenStreetMap en tiempo real')}
function upsertDriverMarker(d){if(!map||!d.latitude||!d.longitude||d.driver_id===currentUserId)return;const pos=[d.latitude,d.longitude];const state=d.availability==='busy'?'busy':'available';if(!driverMarkers[d.driver_id])driverMarkers[d.driver_id]=L.marker(pos,{icon:taxiIcon(state)}).addTo(map);else{driverMarkers[d.driver_id].setLatLng(pos);driverMarkers[d.driver_id].setIcon(taxiIcon(state))}setTaxiHeading(driverMarkers[d.driver_id],(d.heading!=null?d.heading:d.heading_deg));driverMarkers[d.driver_id].setPopupContent('Taxi · '+(state==='busy'?'Ocupado':'Libre'))}
function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}async function searchPlaces(query){const q=query.trim();if(q.length<3)return [];const suffix=/murcia|alcantarilla|sangonera|españa|es$/i.test(q)?q:q+', Murcia, España';const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=es&limit=8&q='+encodeURIComponent(suffix),{headers:{Accept:'application/json'}});if(!r.ok)throw Error('No se pudo consultar el buscador');return await r.json()}function setupPlaceSearch(inputId,listId){const input=$(inputId),list=$(listId);let timer=null;input.addEventListener('input',()=>{input.dataset.lat='';input.dataset.lon='';clearTimeout(timer);const q=input.value.trim();if(q.length<3){list.innerHTML='';hide(listId);return}timer=setTimeout(async()=>{try{const places=await searchPlaces(q);list.innerHTML=places.length?places.map((p,i)=>'<button type="button" class="place-result" data-index="'+i+'">'+escapeHtml(p.display_name)+'</button>').join(''):'<div class="place-empty">No hay coincidencias. Prueba con calle, número, local y municipio.</div>';show(listId);list.querySelectorAll('.place-result').forEach((b,i)=>b.onclick=()=>{const p=places[i];input.value=p.display_name;input.dataset.lat=p.lat;input.dataset.lon=p.lon;hide(listId);input.dispatchEvent(new Event('change'))})}catch(e){list.innerHTML='<div class="place-empty">No se pudo consultar el buscador.</div>';show(listId)}},350)});input.addEventListener('blur',()=>setTimeout(()=>hide(listId),250))}function clientDash(user){$('dash-title').textContent='Pide tu taxi';$('dash-sub').textContent='Busca una dirección, bar o local y elige una coincidencia exacta';$('dash-content').innerHTML='<div id="map" class="map"></div><div class="box" style="margin-top:12px"><div class="place-search"><div class="field"><label>Recogida</label><input id="origin" autocomplete="off" placeholder="Calle, número, local y municipio"><div id="origin-results" class="place-results hidden"></div></div></div><div class="place-search"><div class="field"><label>Destino</label><input id="destination" autocomplete="off" placeholder="Ej.: Bar Manila, Barrio Pérez, Sangonera la Seca"><div id="destination-results" class="place-results hidden"></div></div></div><button class="primary" id="request">Solicitar taxi</button><div class="panel-row"><div class="metric"><strong id="free-count">—</strong><small>Taxis visibles</small></div><div class="metric"><strong>GPS</strong><small>Alta precisión activa</small></div></div></div>';const m=makeMap();setupPlaceSearch('origin','origin-results');setupPlaceSearch('destination','destination-results');navigator.geolocation&&navigator.geolocation.watchPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];const gpsHeading=Number(pos.coords.heading);if(Number.isFinite(gpsHeading)&&(pos.coords.speed==null||pos.coords.speed>0.5))currentHeading=gpsHeading;if(!userMarker)userMarker=L.marker(p,{icon:userIcon()}).addTo(m).bindPopup('Tu ubicación');else userMarker.setLatLng(p);m.setView(p,16);$('origin').value='Mi ubicación actual';$('origin').dataset.lat=pos.coords.latitude;$('origin').dataset.lon=pos.coords.longitude},()=>toast('Activa la ubicación precisa del dispositivo'),{enableHighAccuracy:true,maximumAge:5000,timeout:15000});loadDrivers();$('request').onclick=()=>{if(!$('destination').dataset.lat)return toast('Escribe el destino y selecciona una dirección concreta de la lista');toast('Destino seleccionado: '+$('destination').value)}}function distanceM(a,b){const R=6371000,la=(b.lat-a.lat)*Math.PI/180,lo=(b.lon-a.lon)*Math.PI/180;const x=Math.sin(la/2)*Math.sin(la/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(lo/2)*Math.sin(lo/2);return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}async function queueView(user){const [q,s,d,l]=await Promise.all([db.from('queue_entries').select('*'),db.from('stops').select('*'),db.from('drivers').select('license_number,vehicle_plate').eq('id',user.id).maybeSingle(),db.from('driver_locations').select('driver_id,latitude,longitude,availability')]);const stops=(s.data||[]).filter(x=>x.active!==false&&Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude)));const byId={};stops.forEach(x=>byId[String(x.id)]=x);const locations={};(l.data||[]).forEach(x=>locations[x.driver_id]=x);let entries=(q.data||[]).filter(e=>!['left','offline','finished','cancelled'].includes(e.status)).map(e=>{let stop=byId[String(e.stop_id||'')];if(!stop&&e.stop_name)stop=stops.find(x=>String(x.name||'').toLowerCase()===String(e.stop_name).toLowerCase());if(!stop){const loc=locations[e.driver_id];if(loc&&Number.isFinite(Number(loc.latitude))&&Number.isFinite(Number(loc.longitude)))stop=stops.find(x=>distanceM({lat:Number(loc.latitude),lon:Number(loc.longitude)},{lat:Number(x.latitude),lon:Number(x.longitude)})<=75)}if(!stop)return null;e._stop=stop;return e}).filter(Boolean).sort((a,b)=>new Date(a.arrived_at||a.entered_at||a.created_at||a.joined_at||0)-new Date(b.arrived_at||b.entered_at||b.created_at||b.joined_at||0));const mine=entries.findIndex(e=>e.driver_id===user.id);const unifiedPos=mine>=0?mine+1:'—';const cards=stops.map(stop=>{const list=entries.filter(e=>e._stop.id===stop.id);const mineStop=list.findIndex(e=>e.driver_id===user.id);return {name:stop.name||'Parada sin nombre',licenses:list.map(e=>e.license_number||e.driver_license||e.vehicle_number||(e.driver_id?e.driver_id.slice(0,6):'—')),position:mineStop>=0?mineStop+1:null}});return {unifiedPos,stops:cards,license:(d.data&&d.data.license_number)||'—'}}function renderQueueView(info){$('unified-pos').textContent=info.unifiedPos||'—';if($('queue-inline'))$('queue-inline').textContent=info.unifiedPos||'—';$('stop-list').innerHTML=info.stops.length?info.stops.map(s=>'<div class="stop-card"><strong>'+s.name+'</strong><span>Licencias: '+(s.licenses.length?s.licenses.join(', '):'—')+(s.position?' · Tu posición '+s.position:'')+'</span></div>').join(''):'<div class="stop-card"><strong>Sin parada asignada</strong><span>Cuando entres en el radio aparecerás aquí automáticamente.</span></div>';if($('driver-license'))$('driver-license').textContent=info.license}
async function refreshQueue(user){try{renderQueueView(await queueView(user))}catch(e){$('unified-pos').textContent='—';$('stop-list').innerHTML='<div class="stop-card"><strong>Cola unificada</strong><span>Esperando sincronización con el servidor.</span></div>'}}
async function driverDash(user){$('dash-title').textContent='Panel del taxista';$('dash-sub').textContent='';$('dash-content').innerHTML=`<div class="taxi-header"><h2>Taxi Ya</h2><span id="driver-status" class="gps-status">● GPS conectando</span></div><div class="unified-card"><div><small>COLA UNIFICADA</small><strong>Parada unificada</strong></div><b id="unified-pos">—</b><span>POSICIÓN</span></div><div id="map" class="map"></div><div class="map-legend"><span><i class="legend-dot green"></i> Libres</span><span><i class="legend-dot red"></i> Ocupados</span><span><i class="legend-dot yellow"></i> Tu taxi</span></div><button class="location-button" id="location-active">Ubicación activa</button><div class="queue-line">En cola unificada · posición <b id="queue-inline">—</b></div><h3 class="stops-title">PARADAS</h3><div id="stop-list"></div><small class="driver-license-line">Licencia: <b id="driver-license">—</b></small>`;const m=makeMap();await loadDrivers();const info=await queueView(user);renderQueueView(info);queueChannel=db.channel('queue-live').on('postgres_changes',{event:'*',schema:'public',table:'queue_entries'},()=>refreshQueue(user)).subscribe();queueTimer=setInterval(()=>refreshQueue(user),5000);if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(async pos=>{const gpsHeading=Number(pos.coords.heading);if(Number.isFinite(gpsHeading)&&(pos.coords.speed==null||pos.coords.speed>0.5))currentHeading=gpsHeading;const d={driver_id:user.id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy_m:pos.coords.accuracy,heading:currentHeading,speed_mps:pos.coords.speed,availability:'available',updated_at:new Date().toISOString()};await db.from('driver_locations').upsert(d);await db.from('drivers').update({latitude:d.latitude,longitude:d.longitude,gps_accuracy_m:d.accuracy_m,location_updated_at:d.updated_at,availability:'available'}).eq('id',user.id);$('driver-status').textContent='● GPS activo · ±'+Math.round(pos.coords.accuracy)+' m';if(!userMarker)userMarker=L.marker([d.latitude,d.longitude],{icon:taxiIcon('self')}).addTo(m);else userMarker.setLatLng([d.latitude,d.longitude]);setTaxiHeading(userMarker,currentHeading);m.setView([d.latitude,d.longitude],16);$('location-active').textContent='Ubicación activa';},()=>{$('driver-status').textContent='● Permiso de ubicación pendiente';$('location-active').textContent='Activa la ubicación del móvil'},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});else $('driver-status').textContent='GPS no disponible';$('queue-inline').textContent=$('unified-pos').textContent}
function clearStopForm(){if($('stop-name'))$('stop-name').value='';if($('stop-lat'))$('stop-lat').value='';if($('stop-lng'))$('stop-lng').value='';if(adminDraftMarker&&map){map.removeLayer(adminDraftMarker);adminDraftMarker=null}}function selectStopPoint(lat,lng){if($('stop-lat'))$('stop-lat').value=Number(lat).toFixed(6);if($('stop-lng'))$('stop-lng').value=Number(lng).toFixed(6);if(adminDraftMarker&&map)map.removeLayer(adminDraftMarker);adminDraftMarker=L.marker([lat,lng]).addTo(map).bindPopup('Nueva parada: escribe el nombre y guarda').openPopup()}async function saveStop(){const name=$('stop-name').value.trim(),lat=Number($('stop-lat').value),lng=Number($('stop-lng').value);if(!name||!Number.isFinite(lat)||!Number.isFinite(lng))return toast('Haz clic en el mapa y escribe el nombre de la parada');const {error}=await db.from('stops').insert({name,latitude:lat,longitude:lng,active:true});if(error)return toast('No se pudo guardar la parada');toast('Parada creada: '+name);clearStopForm();loadStopsAdmin()}async function updateStop(id){const name=$('stop-name-'+id).value.trim(),lat=Number($('stop-lat-'+id).value),lng=Number($('stop-lng-'+id).value);if(!name||!Number.isFinite(lat)||!Number.isFinite(lng))return toast('Revisa el nombre y las coordenadas');const {error}=await db.from('stops').update({name,latitude:lat,longitude:lng}).eq('id',id);if(error)return toast('No se pudo actualizar la parada');toast('Parada actualizada');loadStopsAdmin()}async function deactivateStop(id){const {error}=await db.from('stops').update({active:false}).eq('id',id);if(error)return toast('No se pudo desactivar la parada');toast('Parada desactivada');loadStopsAdmin()}async function loadStopsAdmin(){if(!map||!$('admin-stops'))return;const {data,error}=await db.from('stops').select('*').order('name');if(error)return toast('No se pudieron cargar las paradas');if($('stop-count'))$('stop-count').textContent=(data||[]).filter(x=>x.active!==false).length;Object.keys(stopLayers).forEach(k=>{map.removeLayer(stopLayers[k]);delete stopLayers[k]});(data||[]).filter(x=>x.active!==false&&Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude))).forEach(x=>{stopLayers[x.id]=L.circleMarker([x.latitude,x.longitude],{radius:9,color:'#08774f',fillColor:'#12a77a',fillOpacity:.8}).addTo(map).bindTooltip(x.name||'Parada')});$('admin-stops').innerHTML=(data||[]).length?(data||[]).map(x=>'<div class="stop-admin-card"><div class="stop-admin-grid"><input id="stop-name-'+x.id+'" value="'+escapeHtml(x.name||'')+'"><input id="stop-lat-'+x.id+'" value="'+escapeHtml(x.latitude||'')+'"><input id="stop-lng-'+x.id+'" value="'+escapeHtml(x.longitude||'')+'"></div><div class="stop-admin-actions"><button class="stop-save" onclick="updateStop(\''+x.id+'\')">Guardar cambios</button><button class="stop-off" onclick="deactivateStop(\''+x.id+'\')">Desactivar</button></div></div>').join(''):'<div class="stop-card"><strong>Aún no hay paradas</strong><span>Haz clic en el mapa para crear la primera.</span></div>'}async function adminDash(user){$('dash-title').textContent='Panel administrador';$('dash-sub').textContent='Crea, edita y posiciona las paradas desde el mapa';$('dash-content').innerHTML='<div id="map" class="map"></div><div class="panel-row"><div class="metric"><strong id="free-count">—</strong><small>Taxis en mapa</small></div><div class="metric"><strong id="stop-count">—</strong><small>Paradas activas</small></div></div><div class="box admin-tools"><h3>Nueva parada</h3><p class="admin-help">Pulsa en el mapa, escribe el nombre y guarda. Las coordenadas quedarán asociadas a esa parada.</p><div class="field"><label>Nombre de la parada</label><input id="stop-name" placeholder="Ej.: Entrevías"></div><div class="stop-admin-grid"><input id="stop-lat" placeholder="Latitud" readonly><input id="stop-lng" placeholder="Longitud" readonly><span></span></div><button class="primary" id="save-stop">Crear parada</button><button class="muted-btn" id="clear-stop">Limpiar</button></div><div class="box admin-tools"><h3>Paradas creadas</h3><div id="admin-stops"></div></div>';const m=makeMap();m.on('click',e=>selectStopPoint(e.latlng.lat,e.latlng.lng));$('save-stop').onclick=saveStop;$('clear-stop').onclick=clearStopForm;loadDrivers();loadStopsAdmin()}$('back').onclick=reset;$('choice-existing').onclick=()=>setAuthMode('login');$('choice-new').onclick=()=>setAuthMode('register');$('login').onclick=()=>auth('login');$('register').onclick=()=>auth('register');$('logout').onclick=async()=>{if(watchId)navigator.geolocation.clearWatch(watchId);if(channel&&db)db.removeChannel(channel);if(queueChannel&&db)db.removeChannel(queueChannel);if(queueTimer)clearInterval(queueTimer);if(map){map.remove();map=null;userMarker=null;driverMarkers={};stopLayers={};adminDraftMarker=null}currentUserId=null;if(db)await db.auth.signOut();reset()};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>authScreen(b.dataset.role));if(db)db.auth.getSession().then(({data})=>{if(data.session)setConnection('Sesión disponible')});
</script></body></html>
