name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!supabase/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html leaflet.css leaflet.js manifest.webmanifest supabase.min.js sw.js icon-192.svg icon-512.svg www/
      - name: Create Android project
        run: npx cap add android
      - name: Apply native Taxi Murcia Android layer
        run: python3 scripts/patch-android.py
      - name: Synchronize Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-murcia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
