name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!supabase/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html leaflet.css leaflet.js manifest.webmanifest supabase.min.js sw.js icon-192.svg icon-512.svg www/
      - name: Create Android project
        run: npx cap add android
      - name: Apply native Taxi Murcia Android layer
        run: python3 scripts/patch-android.py
      - name: Synchronize Capacitor
        run: npx cap sync android
      - name: Verify generated native layer
        run: |
          test -f android/app/src/main/java/es/taximurcia/app/TaxiLocationService.java
          test -f android/app/src/main/java/es/taximurcia/app/ForegroundLocationPlugin.java
          grep -q 'ForegroundLocationPlugin' android/app/src/main/java/es/taximurcia/app/MainActivity.java
          grep -q 'TaxiLocationService' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'startNativeLocationTracking(user)' index.html
          grep -q 'plugin.start' index.html
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK contains native layer
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          PERMS="$($AAPT dump permissions "$APK")"
          printf '%s\n' "$PERMS" | grep -Fq "android.permission.ACCESS_BACKGROUND_LOCATION"
          printf '%s\n' "$PERMS" | grep -Fq "android.permission.FOREGROUND_SERVICE_LOCATION"
          MANIFEST="$($AAPT dump xmltree "$APK" AndroidManifest.xml)"
          printf '%s\n' "$MANIFEST" | grep -Fq 'TaxiLocationService'
          printf '%s\n' "$MANIFEST" | grep -Fq 'foregroundServiceType(0x0101057c)="location"'
          for DEX in $(unzip -Z1 "$APK" 'classes*.dex'); do
            unzip -p "$APK" "$DEX"
          done > native.dex
          strings native.dex | grep -Fq 'es/taximurcia/app/TaxiLocationService'
          strings native.dex | grep -Fq 'es/taximurcia/app/ForegroundLocationPlugin'
          strings native.dex | grep -Fq 'startForeground'
          strings native.dex | grep -Fq 'requestLocationUpdates'
          rm -f native.dex
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-murcia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
